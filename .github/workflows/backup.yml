name: Nightly database backup

# Section 10: pg_dump every night to private storage, 30-day retention.
# Secrets: DATABASE_URL (a read-capable Neon URL), BACKUP_BUCKET (s3://bucket/prefix),
# AWS_ACCESS_KEY_ID, AWS_SECRET_ACCESS_KEY, AWS_REGION. Any S3-compatible bucket works.

on:
  schedule:
    - cron: "15 2 * * *"
  workflow_dispatch:

jobs:
  dump:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Install PostgreSQL 18 client
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq postgresql-common
          sudo /usr/share/postgresql-common/pgdg/apt.postgresql.org.sh -y
          sudo apt-get install -y -qq postgresql-client-18
      - name: Dump
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: |
          STAMP=$(date -u +%Y-%m-%dT%H%M%SZ)
          pg_dump "$DATABASE_URL" --format=custom --no-owner --no-privileges --file "finance-tracker-$STAMP.dump"
          gzip -9 "finance-tracker-$STAMP.dump"
          echo "FILE=finance-tracker-$STAMP.dump.gz" >> "$GITHUB_ENV"
      - name: Upload and prune older than 30 days
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          AWS_REGION: ${{ secrets.AWS_REGION }}
          BUCKET: ${{ secrets.BACKUP_BUCKET }}
        run: |
          aws s3 cp "$FILE" "$BUCKET/$FILE" --sse AES256
          CUTOFF=$(date -u -d '30 days ago' +%Y-%m-%d)
          aws s3 ls "$BUCKET/" | awk '{print $4}' | while read -r key; do
            [ -z "$key" ] && continue
            DAY=$(echo "$key" | sed -E 's/finance-tracker-([0-9]{4}-[0-9]{2}-[0-9]{2}).*/\1/')
            if [[ "$DAY" < "$CUTOFF" ]]; then aws s3 rm "$BUCKET/$key"; fi
          done
      - name: Keep a copy as a workflow artifact too (30 days)
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.FILE }}
          path: ${{ env.FILE }}
          retention-days: 30
