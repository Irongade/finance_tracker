name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: finance_tracker_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/finance_tracker_test
      DATABASE_URL_TEST: postgresql://postgres:postgres@localhost:5432/finance_tracker_test
      BETTER_AUTH_SECRET: ci-only-secret-ci-only-secret-ci-only
      BETTER_AUTH_URL: http://localhost:3000
      FIXED_TODAY: "2026-08-28"
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm typecheck
      - name: Unit + repository tests (integration tests skip without the workbook)
        run: pnpm test
      - run: pnpm db:migrate
      - run: pnpm build
      - name: e2e smoke (skipped until the workbook seed is available in CI)
        if: ${{ hashFiles('data/Ade_P_Finance_Tracker_v2.xlsx') != '' }}
        run: |
          pnpm exec playwright install --with-deps chromium
          pnpm db:seed
          pnpm test:e2e
